[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta"]
resolver = "3"

[workspace.package]
version      = "0.19.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "8a27180ce1e42ad1a679c9d8b43afe96b19142c2" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "115a62dd2974b372e4b932b7ce1ff5df00514107" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "6a49664652e31ff32648f2152b596a76b241019a" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "a918b7dbca09538abc9b8fce75f61ba8abe6093c" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
