[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.22.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "a5e04b756dc300ba90f9fde2fa3ff6f5cc24e445" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "1ec9e004ad60e3789f529dcab5d3c10d2571056e" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "8e56457d41552f07df5b39a0b9e6e7248c72da43" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "0ee659384a2c3935930923427f921e34ebc634ad" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
getrandom           = "0.4"
