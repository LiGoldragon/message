[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.22.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "8b6faff411d7325b6c3196952a15ee7c903d35cc" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "91ee0eb8c936740de7a4cdd701a409aa07fb2087" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "13c2eb9f5c6e358f22415c96e03862e78a5f8091" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "bc090753a24ee56bd689da954815f7115afa2c4d" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
getrandom           = "0.4"
