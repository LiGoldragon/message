[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.22.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "4c1cd6936cc1bae03e63fad820c4fcf386608ff0" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "f916df1a520dfdac769eb3adaa0a34ecb63b6849" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "065730ff8b628657a692e8890714cadde881f1d4" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "82be495e12d06aaede190e11da384fc8e973d7fe" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
getrandom           = "0.4"
