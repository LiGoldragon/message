[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.21.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "354d79d258cda175491438934979966bb95a9122" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "b26db74cc9791a50c2ad96562e0d4dc1dbb1e05b" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "fd721ab4258ea7e185dda905ac2b6ca852e4aaad" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "2e3c9059182000f5330daeb21500270e68a5bb28" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
