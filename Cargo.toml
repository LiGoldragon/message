[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta"]
resolver = "3"

[workspace.package]
version      = "0.19.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "b94d907c4c02c04e9db8754777bdbf169b7ef61b" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "81e12b235476453f9da95fa7508f37eee11a8ebf" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "f95034de0b203d886ba574fcb513c691c64b8498" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "54eb5618e1433b68520ba9644e0428ea0f9ed75d" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
