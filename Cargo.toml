[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.22.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "998c824c98a1e2f5e32f9e3a69bf09d3a29aff6b" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "4d81b6481292f9212065a83c30f29640de60505e" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "3d0a4cdd0364a30e5586eac7db59917faca5072f" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "27d06b7b4995ad275c2c2c85dd0ffb5499482dd7" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
getrandom           = "0.4"
