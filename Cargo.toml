[package]
name         = "message"
version      = "0.12.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
description  = "Message surface, durable messenger, and supervised ingress daemon."

[lib]
name = "message"
path = "src/lib.rs"

[[bin]]
name = "message"
path = "src/main.rs"

[[bin]]
name = "message-daemon"
path = "src/bin/message_daemon.rs"

[[bin]]
name = "message-schema3-probe"
path = "src/bin/message_schema3_probe.rs"

[[bin]]
name = "meta-message"
path = "src/bin/meta_message.rs"

[[bin]]
name = "message-validate-output"
path = "src/bin/message_validate_output.rs"

[[bin]]
name = "message-write-configuration"
path = "src/bin/message_write_configuration.rs"

[[bin]]
name = "relay"
path = "src/bin/relay.rs"

[dependencies]
datom-codec    = { git = "https://github.com/LiGoldragon/datom-codec", rev = "6dccc76b75918a91d3370a9d4fe88aa7dd567876" }
protos         = { git = "https://github.com/LiGoldragon/protos", rev = "171b21f65337983ab624b7b906397a4f1f92c5a3" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message.git", rev = "87a54b0a1cbc9aa02f9ff62e46c6ffca52f9ec25", features = ["datom"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "7bcb0949cdaa4501651ed519625eba48e283fac0", features = ["datom"] }
signal-message = { git = "https://github.com/LiGoldragon/signal-message.git", rev = "a9708f3384af18129cb1c983ffed850c4d631e46", features = ["datom"] }
legacy-signal-message = { package = "signal-message", git = "https://github.com/LiGoldragon/signal-message.git", rev = "dff3fbf3f9e2cd018f06bcf96a06c8367d3e7f31" }
signal-harness = { git = "https://github.com/LiGoldragon/signal-harness.git", rev = "17bdd58bebe230548ff278ee394f89bbecc6ce86", features = ["datom"] }
rkyv           = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
redb           = "4.1"
sema           = { git = "https://github.com/LiGoldragon/sema.git", rev = "51d7927c872f0df12791bad8d39a4db6433b01a1" }
sema-engine    = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "516f01fe0b03157efc6cc3d38b588f0ca123ac94" }
legacy-sema-engine = { package = "sema-engine", git = "https://github.com/LiGoldragon/sema-engine.git", rev = "7158e5503f37fd2fbca1d707f134e38a3fda1176" }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
sha2           = "0.10"
sha1           = "0.10"
base64         = "0.22"
thiserror      = "2"
time           = { version = "0.3", features = ["parsing"] }
tokio          = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
triad-runtime  = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "2abec17849fe270755bb04a13d052e1edbb2a7ab" }

[dev-dependencies]
legacy-message = { package = "message", git = "https://github.com/LiGoldragon/message.git", rev = "38345dae42ac04caad0204ddbb94daf8f92c3367", default-features = false }
redb = "4.1"
rustix = { version = "1", features = ["process"] }
tempfile = "3"

[lints.rust]
unused = "warn"
dead_code = "warn"
