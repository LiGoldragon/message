[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.21.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "9bba9e5b668f1ac3d236072dc1922eb371da7b42" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "a5970e83ca4ad6eda874c24ac44eb6c6779f94ab" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "a3ff95a5fb5b638497645413f29b4fa3b072829d" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "a09d923fc8e5d48136f1867ac66179ce18e39327" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
