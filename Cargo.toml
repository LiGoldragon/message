[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.20.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "f51821454aadccd7ccf782e836738d80cd14ebd0" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "f1ddba8488d109d1dbbfb12715953bd26fbe1738" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "e6ccbddbcc69079203c4bb5e841298ff9ee6cb81" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "efccfb5c11ea56ef6495675e8906dbff8a709713" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
