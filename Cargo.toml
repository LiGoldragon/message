[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta"]
resolver = "3"

[workspace.package]
version      = "0.19.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "289d399c912821ea945d08da303bda50d11e1aca" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "8daefef1eae30dd9e4f56cd27d713199f7df7f4e" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "a991c1499b201ad75a084a6542d2f110c46720ce" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "991859f5f121789c6966d542264baccafd000268" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
