[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta"]
resolver = "3"

[workspace.package]
version      = "0.19.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "3b284e9a8e1c6e5fe5dd3a99150dd6f1ed771712" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "4fdeea1cf6fc923d8365ceb8b1efaeb82829cf9d" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "b619ea0876b0943702a4f527ff3912857d12b532" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "e9ec03de99925ddfd84f93a2e43d5dc2b0f9dcd0" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
