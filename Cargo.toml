[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.20.4"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "e47d1c8fd42694024766904e0a17668c140859ee" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "ad786858a33ed3cd13e279fc12c7102a8a03209a" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "e26fe6e44f411969f73d6c877b4bb46675836a05" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "8b08b93f43685a61fa07aa93bb0d983479591d5b" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
