[package]
name         = "message"
version      = "0.11.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
description  = "Dotos Message surface, durable messenger, and supervised ingress daemon."

[lib]
name = "message"
path = "src/lib.rs"

[[bin]]
name = "message"
path = "src/main.rs"
required-features = ["dotos-text"]

[[bin]]
name = "message-daemon"
path = "src/bin/message_daemon.rs"

[[bin]]
name = "meta-message"
path = "src/bin/meta_message.rs"
required-features = ["dotos-text"]

[[bin]]
name = "message-validate-output"
path = "src/bin/message_validate_output.rs"
required-features = ["dotos-text"]

[[bin]]
name = "message-write-configuration"
path = "src/bin/message_write_configuration.rs"
required-features = ["dotos-text"]

[[test]]
name = "process_boundary"
path = "tests/process_boundary.rs"
required-features = ["dotos-text"]

[[test]]
name = "pty_end_to_end"
path = "tests/pty_end_to_end.rs"
required-features = ["dotos-text"]

[features]
default = ["dotos-text"]
dotos-text = ["signal-message/dotos-text", "meta-signal-message/dotos-text"]

[dependencies]
dotos = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3cf547d2624c6a243e5de5f85c9f3" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message.git", rev = "c349f1252f0544fced18912abdb845bfc95ba826", default-features = false }
rkyv            = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame    = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "01676293a623d97b65e320d4138c4b480c6d5dad", default-features = false }
signal-harness  = { git = "https://github.com/LiGoldragon/signal-harness.git", rev = "bf9722f4fd7553b1821ce55dd04fa14efe4e7062", default-features = false, features = ["dotos-text"] }
signal-message = { git = "https://github.com/LiGoldragon/signal-message.git", rev = "1c7e2e0209cd0e27ce01c290e3318a20905e1142", default-features = false }
redb            = "4.1"
sema            = { git = "https://github.com/LiGoldragon/sema.git", rev = "51d7927c872f0df12791bad8d39a4db6433b01a1" }
sema-engine     = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "72015662fc0f238d80ca6b82fe5a69817179163d" }
thiserror       = "2"
tokio           = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
triad-runtime   = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "895d2e6b9023b2d901fe1ab20e6f8f431c6113b7" }

[dev-dependencies]
rustix = { version = "1", features = ["process"] }
tempfile = "3"

[lints.rust]
unused = "warn"
dead_code = "warn"
