[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.20.4"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "f20d11f063d595c929709de12dfaf225b2dba193" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "b312c9b34a3dfc831026848c976c2c0bd44b0fcc" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "5dee0325fe505dd50fa56d01468e6b35a1271393" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "8cf2c35b324969ac2154e0d2f903915bbb259791" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
