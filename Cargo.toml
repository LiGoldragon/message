[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta", "crates/message-mcp-send"]
resolver = "3"

[workspace.package]
version      = "0.22.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "eabead4" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "3c7ade3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "0a0b7ac2223dd7c4854feb480c3a47e0e4665307" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "9bcb10639cfd9f4c4e66b66fa75c96adb20a201d" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "be732756da4413bd5be85b1ee4f2fcb29a73216a" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "56c0443a9d43d90345b64ed1bbb34b9b541e7a85" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
getrandom           = "0.4"
