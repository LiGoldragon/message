[package]
name         = "message"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
description  = "Persona NOTA message CLI and supervised message ingress daemon."

[lib]
name = "message"
path = "src/lib.rs"

[[bin]]
name = "message"
path = "src/main.rs"

[[bin]]
name = "message-daemon"
path = "src/bin/message_daemon.rs"

[[bin]]
name = "message-validate-output"
path = "src/bin/message_validate_output.rs"

[features]
default = []
nota-text = ["dep:nota-next"]

[dependencies]
nota-codec      = { git = "https://github.com/LiGoldragon/nota-codec.git", branch = "main" }
nota-next       = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main", optional = true }
rkyv            = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-core     = { git = "https://github.com/LiGoldragon/signal-core.git" }
signal-frame    = { git = "https://github.com/LiGoldragon/signal-frame.git", branch = "main" }
signal-persona  = { git = "https://github.com/LiGoldragon/signal-persona.git" }
signal-persona-origin = { git = "https://github.com/LiGoldragon/signal-persona-origin.git" }
signal-message = { git = "https://github.com/LiGoldragon/signal-message.git" }
thiserror       = "2"
triad-runtime   = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }

[build-dependencies]
schema-rust-next = { git = "https://github.com/LiGoldragon/schema-rust-next.git", branch = "main" }

[dev-dependencies]
rustix = { version = "1", features = ["process"] }
tempfile = "3"

[lints.rust]
unused = "warn"
dead_code = "warn"
