[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta"]
resolver = "3"

[workspace.package]
version      = "0.17.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09e2a9d52bf7f2f11e51d15cb6c3177f72c6c927" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "1febca7836bf8d5f5973a302fdd50aa9c84c159b" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "d5742005597088764adfaff9bbcc47ce97180a35" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "14f57596fc235941af081bec50d5d79449bc813a" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "1c9e4b306e2686a2aa7088e461ff6b2f22b45064" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "2ac045c2cb776325ddfcb311be2f28405ae5f973" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
