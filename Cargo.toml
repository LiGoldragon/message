[workspace]
members  = ["crates/message-defaults", "crates/message-nexus", "crates/message", "crates/message-meta"]
resolver = "3"

[workspace.package]
version      = "0.19.1"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/message"
publish      = false

[workspace.dependencies]
message-defaults    = { path = "crates/message-defaults" }
datom-codec         = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb" }
protos              = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3" }
signal-message      = { git = "https://github.com/LiGoldragon/signal-message", rev = "b729a5ab9cd737957a7172b7d0b0202ac18fbc57" }
meta-signal-message = { git = "https://github.com/LiGoldragon/meta-signal-message", rev = "195b9087df3670b47e4e63aa680dbd7baee1faf0" }
signal-flow         = { git = "https://github.com/LiGoldragon/signal-flow", rev = "59aab72513e8e78c9611ab5d620ae3b09b5f1e25" }
meta-signal-flow    = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "dacb3fdd26c23f6aa3f78cbc37389d25f7ac97ee" }
rkyv                = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
