[package]
name        = "message-nexus"
description = "Message Nexus: typed requests delivered through Flow."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true
build = "build.rs"

[lib]
name = "message_nexus"
path = "src/lib.rs"

[[bin]]
name = "message-nexus"
path = "src/main.rs"

# The Nexus thinks in typed values: it compiles its contracts without datom.
[features]
default = []
datom = ["dep:datom-codec"]

[dependencies]
libc = "0.2"
message-defaults.workspace = true
datom-codec = { workspace = true, optional = true }
signal-message.workspace      = true
meta-signal-message.workspace = true
signal-flow.workspace         = true
flow-ethos.workspace          = true
meta-signal-flow.workspace    = true
rkyv.workspace                = true
getrandom.workspace           = true
rustix      = { version = "1", features = ["net", "time"] }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine", rev = "6a95a0925c9e6a6a144037ffdbad8c7d3cc126f2" }
thiserror   = "2"
redb = "4"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "8c95310" }

[lints.rust]
unused    = { level = "warn", priority = -1 }
dead_code = "warn"

# The generated contract is committed byte for byte from its ethos source.
[lints.clippy]
large_enum_variant = "allow"
