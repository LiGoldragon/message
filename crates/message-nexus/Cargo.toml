[package]
name        = "message-nexus"
description = "Message Nexus: typed requests delivered through Flow."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true
build = "build.rs"

[lib]
name = "message_nexus"
path = "src/lib.rs"

[[bin]]
name = "message-nexus"
path = "src/main.rs"

# The Nexus thinks in typed values: it compiles its contracts without datom.
[features]
default = []
datom = ["dep:datom-codec"]

[dependencies]
libc = "0.2"
message-defaults.workspace = true
datom-codec = { workspace = true, optional = true }
signal-message.workspace      = true
meta-signal-message.workspace = true
signal-flow.workspace         = true
meta-signal-flow.workspace    = true
rkyv.workspace                = true
rustix      = { version = "1", features = ["net", "time"] }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine", rev = "9884905ff9c660ad97a35c524e42532d5c7bac90" }
thiserror   = "2"
redb = "4"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "c2653dd82adbdb1f1f2f654405c6620e0d06fd58" }

[lints.rust]
unused    = { level = "warn", priority = -1 }
dead_code = "warn"
