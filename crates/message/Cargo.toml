[package]
name        = "message"
description = "The message CLI: one inline datom in, Signal to the Message Nexus, datom out."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "message"
path = "src/main.rs"

[dependencies]
datom-codec.workspace = true
protos.workspace      = true
rkyv.workspace        = true
signal-message = { workspace = true, features = ["datom"] }
